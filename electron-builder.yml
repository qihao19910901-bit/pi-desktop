appId: com.pi.desktop
productName: Pi Desktop
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets

asar: true
files:
  - electron/**/*.js
  - assets/icon.png
  - package.json
asarUnpack:
  - node_modules/**

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pi Desktop
  uninstallDisplayName: Pi Desktop
  deleteAppDataOnUninstall: false

compression: maximum
npmRebuild: false

publish:
  provider: github
  owner: qihao19910901-bit
  repo: pi-desktop
