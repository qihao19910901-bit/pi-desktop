name: Auto Update & Release
on:
  schedule: [{ cron: '0 0 * * *' }]
  workflow_dispatch:
    inputs:
      force:
        description: Force a verified rebuild
        type: boolean
        default: false
permissions: { contents: write }
concurrency: { group: pi-desktop-release, cancel-in-progress: false }
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Test current tree
        shell: pwsh
        run: |
          npm ci
          npm test
      - name: Read stable upstream versions
        id: upstream
        shell: pwsh
        run: |
          $piWeb = (npm view @agegr/pi-web version).Trim()
          $pi = (npm view @earendil-works/pi-coding-agent version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'npm view failed' }
          "pi_web=$piWeb" >> $env:GITHUB_OUTPUT
          "pi=$pi" >> $env:GITHUB_OUTPUT
      - name: Prepare candidate and inspect matching Release
        id: candidate
        env: { GH_TOKEN: '${{ github.token }}', FORCE: '${{ inputs.force || ''false'' }}', PI_WEB: '${{ steps.upstream.outputs.pi_web }}', PI: '${{ steps.upstream.outputs.pi }}' }
        shell: pwsh
        run: |
          $args = @('scripts/prepare-update.js', '--pi-web', $env:PI_WEB, '--pi', $env:PI)
          if ($env:FORCE -eq 'true') { $args += '--force' }
          $json = & node @args
          if ($LASTEXITCODE -ne 0) { throw 'candidate generation failed' }
          $candidate = $json | ConvertFrom-Json
          $tag = "v$($candidate.desktopVersion)"
          try {
            $release = gh release view $tag --repo ${{ github.repository }} --json assets,isDraft,url 2>$null
          } catch { $release = $null }
          $releaseLookupExit = $LASTEXITCODE
          cmd /c exit 0
          $complete = $false
          $url = ''
          if ($releaseLookupExit -eq 0) {
            $release = $release | ConvertFrom-Json
            $url = $release.url
            $assetArgs = @('scripts/verify-release-assets.js', '--version', $candidate.desktopVersion)
            foreach ($asset in $release.assets) { $assetArgs += @('--asset', $asset.name) }
            & node @assetArgs | Out-Host
            $complete = $LASTEXITCODE -eq 0 -and -not $release.isDraft
          }
          $mode = if ($candidate.action -eq 'update') { 'update' }
            elseif ($candidate.action -eq 'rebuild') { 'rebuild' }
            elseif ($complete) { 'none' }
            else { 'repair' }
          "json=$json" >> $env:GITHUB_OUTPUT
          "version=$($candidate.desktopVersion)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "skip=$($mode -eq 'none')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "release_url=$url" >> $env:GITHUB_OUTPUT
      - name: Write new candidate
        if: steps.candidate.outputs.mode == 'update'
        env: { PI_WEB: '${{ steps.upstream.outputs.pi_web }}', PI: '${{ steps.upstream.outputs.pi }}' }
        shell: pwsh
        run: |
          node scripts/prepare-update.js --pi-web $env:PI_WEB --pi $env:PI --write
          npm install --package-lock-only --ignore-scripts
      - name: Clean verified build
        if: steps.candidate.outputs.skip != 'true'
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'npm test failed' }
          npm run build -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'package build failed' }
          npm run verify:package
          if ($LASTEXITCODE -ne 0) { throw 'package verification failed' }
          npm run smoke:package
          if ($LASTEXITCODE -ne 0) { throw 'package smoke failed' }
      - name: Assert built versions
        id: actual
        if: steps.candidate.outputs.skip != 'true'
        env: { CANDIDATE: '${{ steps.candidate.outputs.json }}' }
        shell: pwsh
        run: |
          $candidate = $env:CANDIDATE | ConvertFrom-Json
          $desktop = node -p "require('./package.json').version"
          $piWeb = node -p "require('./node_modules/@agegr/pi-web/package.json').version"
          $pi = node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version"
          if ($desktop -ne $candidate.desktopVersion -or
              $piWeb -ne $candidate.new.piWebVersion -or
              $pi -ne $candidate.new.piVersion) { throw 'built versions do not match candidate' }
          "desktop=$desktop" >> $env:GITHUB_OUTPUT
          "pi_web=$piWeb" >> $env:GITHUB_OUTPUT
          "pi=$pi" >> $env:GITHUB_OUTPUT
      - name: Commit and push new candidate atomically
        if: steps.candidate.outputs.mode == 'update'
        env: { TAG: '${{ steps.candidate.outputs.tag }}' }
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'new candidates may publish only from main' }
          git config user.name pi-desktop-bot
          git config user.email bot@pi-desktop.local
          git add package.json package-lock.json
          git commit -m "chore: release $env:TAG [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'release commit failed' }
          git tag $env:TAG
          if ($LASTEXITCODE -ne 0) { throw 'release tag creation failed' }
          git push --atomic origin HEAD:main "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'atomic release push failed' }
      - name: Create or reset draft Release
        if: steps.candidate.outputs.skip != 'true'
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ steps.candidate.outputs.tag }}' }
        shell: pwsh
        run: |
          try {
            gh release view $env:TAG --repo ${{ github.repository }} 2>$null
          } catch {
            # Expected when this verified tag has no Release yet; the saved probe status selects create below.
          }
          $releaseLookupExit = $LASTEXITCODE
          cmd /c exit 0
          if ($releaseLookupExit -eq 0) { gh release edit $env:TAG --draft }
          else { gh release create $env:TAG --draft --title $env:TAG --notes 'Verified automated build' }
      - name: Upload candidate assets
        if: steps.candidate.outputs.skip != 'true'
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ steps.candidate.outputs.tag }}' }
        shell: pwsh
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:TAG" | ConvertFrom-Json
          foreach ($asset in $release.assets) {
            gh release delete-asset $env:TAG $asset.name --yes
          }
          $assets = @(Get-ChildItem dist -File | Where-Object {
            $_.Name -eq 'latest.yml' -or $_.Name -like '*.exe' -or $_.Name -like '*.blockmap'
          } | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw 'no release assets found' }
          gh release upload $env:TAG @assets --clobber
      - name: Verify draft assets
        if: steps.candidate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          VERSION: ${{ steps.candidate.outputs.version }}
        shell: pwsh
        run: |
          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:TAG" | ConvertFrom-Json
          $args = @('scripts/verify-release-assets.js', '--version', $env:VERSION)
          foreach ($asset in $release.assets) { $args += @('--asset', $asset.name) }
          & node @args
          if ($LASTEXITCODE -ne 0) { throw 'draft assets are incomplete; Release remains draft' }
      - name: Publish verified Release
        if: steps.candidate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: pwsh
        run: gh release edit $env:TAG --draft=false --latest
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "### Pi Desktop release" >> $env:GITHUB_STEP_SUMMARY
          "- Mode: ${{ steps.candidate.outputs.mode }}" >> $env:GITHUB_STEP_SUMMARY
          "- Desktop: ${{ steps.actual.outputs.desktop || steps.candidate.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          "- pi-web: ${{ steps.actual.outputs.pi_web || steps.upstream.outputs.pi_web }}" >> $env:GITHUB_STEP_SUMMARY
          "- Pi: ${{ steps.actual.outputs.pi || steps.upstream.outputs.pi }}" >> $env:GITHUB_STEP_SUMMARY
          "- Tests/build/verify/smoke: ${{ steps.candidate.outputs.skip == 'true' && 'already verified' || 'executed' }}" >> $env:GITHUB_STEP_SUMMARY
          "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.candidate.outputs.tag }}" >> $env:GITHUB_STEP_SUMMARY
