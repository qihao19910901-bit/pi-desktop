# auto-update.yml — 双轨检测：pi-web + pi-coding-agent 任一更新即自动构建
#
# 触发方式：
#   1. 定时：每天 UTC 0 点（北京时间 8 点）
#   2. 手动：GitHub Actions 页面 → Run workflow
#
# 流程：
#   npm 检查 pi-web 和 pi-coding-agent 最新版本
#   → 任一有新版本则升级依赖 → electron-builder 打包并发布 GitHub Release
#   → 用户桌面端 electron-updater 自动检测到新 release → 提示更新

name: Auto Update & Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建（即使没有新版本）'
        type: boolean
        default: false

jobs:
  check-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      - name: 检查更新（pi-web + pi-coding-agent）
        id: check
        shell: bash
        run: |
          # 当前版本
          PIWEB_CUR=$(node -p "require('./node_modules/@agegr/pi-web/package.json').version")
          PI_CUR=$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")

          # npm 最新版本
          PIWEB_LATEST=$(npm view @agegr/pi-web version)
          PI_LATEST=$(npm view @earendil-works/pi-coding-agent version)

          echo "piweb_current=${PIWEB_CUR}" >> $GITHUB_OUTPUT
          echo "piweb_latest=${PIWEB_LATEST}" >> $GITHUB_OUTPUT
          echo "pi_current=${PI_CUR}" >> $GITHUB_OUTPUT
          echo "pi_latest=${PI_LATEST}" >> $GITHUB_OUTPUT

          NEEDS_UPDATE="false"
          REASON=""

          if [ "$PIWEB_CUR" != "$PIWEB_LATEST" ]; then
            NEEDS_UPDATE="true"
            REASON="pi-web: ${PIWEB_CUR} → ${PIWEB_LATEST}"
          fi

          if [ "$PI_CUR" != "$PI_LATEST" ]; then
            NEEDS_UPDATE="true"
            REASON="${REASON}${REASON:+ / }pi: ${PI_CUR} → ${PI_LATEST}"
          fi

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            NEEDS_UPDATE="true"
            REASON="手动强制重建"
          fi

          echo "needs_update=${NEEDS_UPDATE}" >> $GITHUB_OUTPUT
          echo "reason=${REASON}" >> $GITHUB_OUTPUT

          echo "pi-web: ${PIWEB_CUR} → ${PIWEB_LATEST}"
          echo "pi:     ${PI_CUR} → ${PI_LATEST}"
          echo "更新:   ${NEEDS_UPDATE} (${REASON})"

      - name: 升级依赖
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          # 升级 pi-web（会顺带更新 pi-coding-agent）
          npm install @agegr/pi-web@latest
          # 升级 pi-coding-agent（确保 override 生效，即使 pi-web 没更新）
          npm install @earendil-works/pi-coding-agent@latest

          PIWEB_NEW=$(node -p "require('./node_modules/@agegr/pi-web/package.json').version")
          PI_NEW=$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")
          echo ">>> 已升级 pi-web → v${PIWEB_NEW}, pi → v${PI_NEW}"

          # 更新 package.json：依赖版本 + 自增 patch 号
          node -e "
            const pkg = require('./package.json');
            pkg.dependencies['@agegr/pi-web'] = '^${PIWEB_NEW}';
            pkg.dependencies['@earendil-works/pi-coding-agent'] = '^${PI_NEW}';
            // 自增 patch 版本号（1.1.0 → 1.1.1）
            const [major, minor, patch] = pkg.version.split('.').map(Number);
            pkg.version = major + '.' + minor + '.' + (patch + 1);
            console.log('pi-desktop version bumped to ' + pkg.version);
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: 提交版本变更 [skip ci]
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          git config user.name "pi-desktop-bot"
          git config user.email "bot@pi-desktop.local"
          git add package.json package-lock.json
          PIWEB_NEW=$(node -p "require('./node_modules/@agegr/pi-web/package.json').version")
          PI_NEW=$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")
          DESKTOP_VER=$(node -p "require('./package.json').version")
          git commit -m "chore: bump to pi-desktop ${DESKTOP_VER} (pi-web ${PIWEB_NEW}, pi ${PI_NEW}) [skip ci]"
          git push

      - name: 构建并发布
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          DESKTOP_VER=$(node -p "require('./package.json').version")
          # 创建 git tag（electron-builder 发布需要）
          git tag -a "v${DESKTOP_VER}" -m "v${DESKTOP_VER}"
          git push origin "v${DESKTOP_VER}"
          echo ">>> tag v${DESKTOP_VER} 已推送"
          # 构建并发布
          npm run build

      - name: 汇总
        shell: bash
        run: |
          echo "========================================="
          echo "pi-web: ${{ steps.check.outputs.piweb_current }} → ${{ steps.check.outputs.piweb_latest }}"
          echo "pi:     ${{ steps.check.outputs.pi_current }} → ${{ steps.check.outputs.pi_latest }}"
          echo "结果:   ${{ steps.check.outputs.needs_update == 'true' && '已更新' || '已是最新' }}"
          echo "原因:   ${{ steps.check.outputs.reason }}"
          echo "========================================="
