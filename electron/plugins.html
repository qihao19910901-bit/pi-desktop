<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件管理 - Pi Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
    background: #1e1e2e; color: #cdd6f4; font-size: 14px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid #313244;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #181825;
  }
  header h1 { font-size: 15px; font-weight: 600; margin-right: auto; }
  .cwd-input {
    background: #11111b; color: #cdd6f4; border: 1px solid #45475a;
    border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: Consolas, monospace;
    min-width: 220px; max-width: 340px;
  }
  .cwd-input::placeholder { color: #585b70; }
  .btn {
    background: #313244; color: #cdd6f4; border: 1px solid #45475a;
    border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #45475a; }
  .btn.primary { background: #89b4fa; color: #11111b; border-color: #89b4fa; }
  .btn.primary:hover { background: #a6c8ff; }
  .btn.danger { color: #f38ba8; border-color: #f38ba8; background: transparent; }
  .btn.danger:hover { background: rgba(243,139,168,.12); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .toolbar {
    padding: 10px 16px; border-bottom: 1px solid #313244;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .toolbar input[type=text] {
    flex: 1; min-width: 200px; background: #11111b; color: #cdd6f4;
    border: 1px solid #45475a; border-radius: 6px; padding: 6px 10px; font-size: 13px;
    font-family: inherit;
  }
  .toolbar input[type=text]::placeholder { color: #585b70; }
  .toolbar select {
    background: #11111b; color: #cdd6f4; border: 1px solid #45475a;
    border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }

  .banner {
    margin: 10px 16px 0; padding: 8px 12px; border-radius: 6px; font-size: 13px;
    background: rgba(250,179,135,.12); border: 1px solid #fab387; color: #fab387;
  }
  .banner.error {
    background: rgba(243,139,168,.12); border-color: #f38ba8; color: #f38ba8;
  }

  main { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .empty { text-align: center; color: #6c7086; padding: 48px 20px; line-height: 1.8; }
  .empty code {
    background: #11111b; padding: 2px 6px; border-radius: 4px;
    font-size: 12px; color: #a6adc8;
  }

  .plugin {
    background: #181825; border: 1px solid #313244; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .plugin-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .plugin-source { font-family: Consolas, monospace; font-size: 13px; color: #89dceb;
    word-break: break-all; flex: 1; min-width: 160px; }
  .scope-tag { font-size: 11px; color: #a6adc8; background: #313244;
    padding: 2px 8px; border-radius: 10px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .badge.loaded { background: rgba(166,227,161,.15); color: #a6e3a1; }
  .badge.disabled { background: rgba(203,166,247,.15); color: #cba6f7; }
  .badge.installed { background: rgba(137,180,250,.15); color: #89b4fa; }
  .badge.missing { background: rgba(249,226,175,.15); color: #f9e2af; }
  .badge.error { background: rgba(243,139,168,.15); color: #f38ba8; }
  .plugin-meta { font-size: 12px; color: #6c7086; margin-top: 6px; display: flex;
    gap: 14px; flex-wrap: wrap; }
  .plugin-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .resource-list { margin-top: 8px; font-size: 12px; color: #a6adc8; }
  .resource-list div { padding: 2px 0; }
  .resource-kind { color: #94e2d5; margin-right: 6px; }
  .diagnostic { margin-top: 6px; font-size: 12px; }
  .diagnostic.warning { color: #f9e2af; }
  .diagnostic.error { color: #f38ba8; }
  .loading { text-align: center; color: #6c7086; padding: 40px; }

  /* 模态框（Electron 不支持 window.confirm） */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #181825; border: 1px solid #45475a; border-radius: 10px;
    padding: 18px 20px; width: 420px; max-width: 90vw;
  }
  .modal h3 { font-size: 14px; margin-bottom: 12px; }
  .modal .modal-text { font-size: 13px; color: #cdd6f4; margin-bottom: 14px; line-height: 1.6; word-break: break-all; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>插件管理</h1>
  <input type="text" id="cwdInput" class="cwd-input" title="工作目录（必须是被信任的项目目录）" placeholder="工作目录…">
  <button class="btn" id="cwdApplyBtn">切换</button>
  <button class="btn" id="refreshBtn">刷新</button>
</header>

<div class="toolbar">
  <input type="text" id="sourceInput" placeholder="插件来源：直接填 npm:包名 / git:地址 / 本地路径（无需 pi install 前缀）">
  <select id="scopeSelect" title="安装作用域">
    <option value="global">全局</option>
    <option value="project">项目</option>
  </select>
  <button class="btn primary" id="installBtn">安装</button>
</div>

<div id="banner"></div>

<main id="list">
  <div class="loading">加载中…</div>
</main>

<!-- 确认模态框 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle">确认</h3>
    <div class="modal-text" id="confirmText"></div>
    <div class="modal-actions">
      <button class="btn" id="confirmCancelBtn">取消</button>
      <button class="btn danger" id="confirmOkBtn">确定</button>
    </div>
  </div>
</div>

<script>
(function () {
  const listEl = document.getElementById('list');
  const bannerEl = document.getElementById('banner');
  const cwdInput = document.getElementById('cwdInput');
  const cwdApplyBtn = document.getElementById('cwdApplyBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const installBtn = document.getElementById('installBtn');
  const sourceInput = document.getElementById('sourceInput');
  const scopeSelect = document.getElementById('scopeSelect');

  let cwd = null;
  let pendingConfirm = null;

  // ---- 模态框（Electron 不支持 window.confirm） ----
  const confirmModal = document.getElementById('confirmModal');
  const confirmTitle = document.getElementById('confirmTitle');
  const confirmText = document.getElementById('confirmText');
  function showConfirm(title, text, onOk) {
    confirmTitle.textContent = title;
    confirmText.textContent = text;
    pendingConfirm = onOk;
    confirmModal.classList.add('show');
  }
  function hideConfirm() { confirmModal.classList.remove('show'); pendingConfirm = null; }

  function showBanner(message, isError) {
    if (!message) { bannerEl.textContent = ''; bannerEl.className = ''; return; }
    bannerEl.textContent = message;
    bannerEl.className = 'banner' + (isError ? ' error' : '');
  }

  const STATUS_LABELS = {
    loaded: '已加载', disabled: '已禁用', installed: '已安装', missing: '缺失',
  };
  const SCOPE_LABELS = { project: '项目', global: '全局' };
  const RESOURCE_LABELS = {
    extension: '扩展', skill: '技能', prompt: '提示词', theme: '主题',
  };

  async function load() {
    try {
      const data = await window.piDesktop.listPlugins(cwd);
      render(data);
      if (!data.projectResourcesLoaded) {
        showBanner('项目资源未受信任：只能在“全局”作用域安装/修改插件。');
      } else {
        showBanner('');
      }
    } catch (error) {
      showBanner('加载失败：' + error.message, true);
      listEl.innerHTML = '<div class="empty">加载插件列表失败，请确认 Pi 服务已启动后刷新。</div>';
    }
  }

  function render(data) {
    const packages = data.packages || [];
    const totals = data.totals || {};
    if (packages.length === 0) {
      listEl.innerHTML = `
        <div class="empty">
          还没有配置任何插件。<br>
          在顶部输入来源后点击“安装”，例如<br>
          <code>npm:some-plugin</code>　<code>git:https://github.com/user/repo</code><br>
          已加载资源：扩展 ${totals.extensions || 0} · 技能 ${totals.skills || 0} ·
          提示词 ${totals.prompts || 0} · 主题 ${totals.themes || 0}
        </div>`;
      return;
    }
    listEl.innerHTML = '';
    for (const pkg of packages) {
      listEl.appendChild(renderPlugin(pkg));
    }
  }

  function renderPlugin(pkg) {
    const el = document.createElement('div');
    el.className = 'plugin';

    const statusClass = pkg.status === 'missing' ? 'missing'
      : (pkg.status === 'loaded' ? 'loaded'
        : (pkg.status === 'disabled' ? 'disabled' : 'installed'));
    const counts = pkg.counts || {};
    const countText = ['extensions', 'skills', 'prompts', 'themes']
      .filter(k => counts[k] > 0)
      .map(k => RESOURCE_LABELS[k] + ' ' + counts[k]).join(' · ');

    el.innerHTML = `
      <div class="plugin-head">
        <span class="plugin-source" title="${escapeHtml(pkg.source)}">${escapeHtml(pkg.source)}</span>
        <span class="scope-tag">${SCOPE_LABELS[pkg.scope] || pkg.scope}</span>
        <span class="badge ${statusClass}">${STATUS_LABELS[pkg.status] || pkg.status}</span>
      </div>
      <div class="plugin-meta">
        ${pkg.packageName ? '<span>' + escapeHtml(pkg.packageName) + (pkg.version ? ' @ ' + escapeHtml(pkg.version) : '') + '</span>' : ''}
        ${pkg.installedPath ? '<span title="' + escapeHtml(pkg.installedPath) + '">已安装</span>' : ''}
        ${countText ? '<span>' + countText + '</span>' : ''}
      </div>
      <div class="plugin-actions">
        ${pkg.status === 'disabled'
          ? '<button class="btn" data-action="enable">启用</button>'
          : '<button class="btn" data-action="disable">禁用</button>'}
        <button class="btn" data-action="update">更新</button>
        <button class="btn danger" data-action="remove">移除</button>
      </div>
      ${renderResources(pkg)}
      ${renderDiagnostics(pkg)}
    `;
    el.querySelectorAll('button[data-action]').forEach((btn) => {
      btn.addEventListener('click', () => runAction(pkg, btn.dataset.action));
    });
    return el;
  }

  function renderResources(pkg) {
    const resources = pkg.resources || [];
    if (resources.length === 0) return '';
    const rows = resources.map((r) =>
      '<div><span class="resource-kind">' + (RESOURCE_LABELS[r.kind] || r.kind) + '</span>'
      + escapeHtml(r.relativePath || r.path || r.name || '') + '</div>').join('');
    return '<div class="resource-list">' + rows + '</div>';
  }

  function renderDiagnostics(pkg) {
    const diags = (pkg.diagnostics || []).filter(d => d.source === pkg.source);
    if (diags.length === 0) return '';
    return diags.map((d) =>
      '<div class="diagnostic ' + (d.type === 'error' ? 'error' : 'warning') + '">⚠ '
      + escapeHtml(d.message) + '</div>').join('');
  }

  async function runAction(pkg, action) {
    if (action === 'remove') {
      showConfirm('移除插件', '确定要移除插件 ' + pkg.source + ' 吗？\n此操作会删除已安装的插件文件。', () => doAction(pkg, action));
      return;
    }
    await doAction(pkg, action);
  }

  async function doAction(pkg, action) {
    try {
      await window.piDesktop.runAction({ cwd, action, source: pkg.source, scope: pkg.scope });
      showBanner('操作成功');
      await load();
    } catch (error) {
      showBanner('操作失败：' + error.message, true);
    }
  }

  async function install() {
    const source = sourceInput.value.trim();
    if (!source) { showBanner('请先填写插件来源', true); return; }
    try {
      await window.piDesktop.runAction({ cwd, action: 'install', source, scope: scopeSelect.value });
      sourceInput.value = '';
      showBanner('安装成功');
      await load();
    } catch (error) {
      showBanner('安装失败：' + error.message, true);
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[ch]);
  }

  refreshBtn.addEventListener('click', () => { showBanner(''); load(); });
  cwdApplyBtn.addEventListener('click', applyCwd);
  cwdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCwd(); });
  installBtn.addEventListener('click', install);

  // 模态框事件
  document.getElementById('confirmCancelBtn').addEventListener('click', hideConfirm);
  document.getElementById('confirmOkBtn').addEventListener('click', () => {
    const cb = pendingConfirm;
    hideConfirm();
    if (cb) cb();
  });
  confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) hideConfirm(); });
  sourceInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') install(); });

  function applyCwd() {
    const value = cwdInput.value.trim();
    if (!value) { showBanner('请填写工作目录', true); return; }
    cwd = value;
    showBanner('');
    load();
  }

  async function init() {
    try {
      cwd = await window.piDesktop.getDefaultCwd();
      cwdInput.value = cwd || '';
      if (!cwd) cwdInput.placeholder = '未找到信任目录，请手动填写';
    } catch (e) {
      cwdInput.placeholder = '未找到信任目录，请手动填写';
    }
    load();
  }

  init();
})();
</script>
</body>
</html>
