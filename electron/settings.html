<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置 - Pi Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
    background: #1e1e2e; color: #cdd6f4; font-size: 14px;
    padding: 16px 20px; height: 100vh; overflow-y: auto;
  }
  h1 { font-size: 16px; margin-bottom: 14px; }
  section {
    background: #181825; border: 1px solid #313244; border-radius: 8px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  section h2 { font-size: 13px; color: #89b4fa; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  .row label { flex: 1; min-width: 200px; cursor: pointer; }
  .row .desc { font-size: 12px; color: #6c7086; display: block; margin-top: 2px; }
  .btn {
    background: #313244; color: #cdd6f4; border: 1px solid #45475a;
    border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #45475a; }
  .btn.primary { background: #89b4fa; color: #11111b; border-color: #89b4fa; }
  .btn.primary:hover { background: #a6c8ff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #89b4fa; cursor: pointer; }
  .mono { font-family: Consolas, monospace; font-size: 12px; color: #a6adc8; }
  .banner {
    margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; font-size: 13px;
    display: none;
    background: rgba(243,139,168,.12); border: 1px solid #f38ba8; color: #f38ba8;
  }
  .banner.show { display: block; }
  .diag-line { font-size: 12px; color: #a6adc8; padding: 2px 0; }
  .diag-line b { color: #cdd6f4; font-weight: 600; }

  /* 配置编辑器 */
  .config-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid #313244; flex-wrap: wrap;
  }
  .config-row:last-child { border-bottom: none; }
  .config-row .cname { font-family: Consolas, monospace; font-size: 13px; color: #89dceb; min-width: 120px; }
  .config-row .cmeta { font-size: 12px; color: #6c7086; flex: 1; }
  .config-row .sensitive { color: #f9e2af; font-size: 11px; }
  .config-modal textarea {
    width: 100%; height: 320px; background: #11111b; color: #cdd6f4;
    border: 1px solid #45475a; border-radius: 6px; padding: 10px;
    font-family: Consolas, monospace; font-size: 12px; line-height: 1.5;
    resize: vertical; margin-bottom: 10px;
  }
  .config-modal .path-hint { font-size: 11px; color: #585b70; margin-bottom: 8px; word-break: break-all; }

  /* 会话导入 */
  .import-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .import-tab {
    padding: 4px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
    background: #313244; color: #a6adc8; border: 1px solid #45475a;
  }
  .import-tab.active { background: #89b4fa; color: #11111b; border-color: #89b4fa; }
  .import-item {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    border-bottom: 1px solid #313244; font-size: 12px; flex-wrap: wrap;
  }
  .import-item .iname { font-family: Consolas, monospace; color: #a6adc8; flex: 1; min-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .import-item .imeta { color: #6c7086; }
</style>
</head>
<body>
<h1>设置</h1>
<div class="banner" id="banner"></div>

<section>
  <h2>通用</h2>
  <div class="row">
    <label>
      <input type="checkbox" id="autostartChk"> 开机自动启动 Pi Desktop
      <span class="desc">登录 Windows 后自动运行（可关托盘保活）</span>
    </label>
  </div>
</section>

<section>
  <h2>全局快捷键</h2>
  <div class="row">
    <label>
      <input type="checkbox" id="shortcutChk"> 启用全局快捷键
      <span class="desc" id="shortcutLabel">Ctrl+Shift+P：显示/隐藏 Pi Desktop 窗口</span>
    </label>
  </div>
</section>

<section>
  <h2>更新</h2>
  <div class="row">
    <span class="mono" id="versionLabel">版本信息…</span>
    <button class="btn primary" id="checkUpdateBtn">检查更新</button>
  </div>
</section>

<section>
  <h2>诊断</h2>
  <div id="diagBox"></div>
  <div class="row" style="margin-top:10px;">
    <button class="btn" id="openLogBtn">打开更新日志目录</button>
    <button class="btn" id="copyDiagBtn">复制诊断信息</button>
  </div>
</section>

<section>
  <h2>配置文件</h2>
  <div id="configList"></div>
  <div class="row" style="margin-top:10px;">
    <span class="desc" style="flex:1;">编辑 pi 配置（models.json / settings.json / auth.json）。保存前自动备份，重启 Agent 后生效。</span>
  </div>
</section>

<section>
  <h2>会话导入</h2>
  <div class="import-tabs">
    <span class="import-tab active" data-src="claude">Claude 会话</span>
    <span class="import-tab" data-src="codex">Codex 会话</span>
  </div>
  <div id="importList" style="max-height:220px;overflow-y:auto;"></div>
  <div class="row" style="margin-top:10px;">
    <span class="desc" style="flex:1;">把 Claude/Codex 的历史会话导入为 pi 会话（复制到 ~/.pi/agent/sessions），导入后可在侧边栏浏览恢复。</span>
    <button class="btn primary" id="importAllBtn">导入全部</button>
  </div>
</section>

<!-- 配置编辑模态框 -->
<div class="modal-overlay config-modal" id="configModal">
  <div class="modal" style="width:560px;">
    <h3 id="configTitle">编辑配置</h3>
    <div class="path-hint" id="configPath"></div>
    <textarea id="configContent" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="btn" id="configCancelBtn">取消</button>
      <button class="btn primary" id="configSaveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  const bannerEl = document.getElementById('banner');
  const autostartChk = document.getElementById('autostartChk');
  const shortcutChk = document.getElementById('shortcutChk');
  const shortcutLabel = document.getElementById('shortcutLabel');
  const versionLabel = document.getElementById('versionLabel');
  const diagBox = document.getElementById('diagBox');

  function showBanner(message) {
    bannerEl.textContent = message;
    bannerEl.className = 'banner' + (message ? ' show' : '');
    if (message) setTimeout(() => showBanner(''), 4000);
  }

  async function load() {
    try {
      const s = await window.piSettings.getState();
      autostartChk.checked = s.autostartEnabled;
      shortcutChk.checked = s.shortcutEnabled;
      shortcutLabel.textContent = s.shortcutLabel + '：显示/隐藏 Pi Desktop 窗口';
      const versions = s.versions || {};
      versionLabel.textContent = '桌面 ' + s.desktopVersion
        + (versions['pi-web'] ? ' · ' + versions['pi-web'] : '')
        + (versions.Pi ? ' · ' + versions.Pi : '');
      const stderr = (s.piweb.stderr || []).slice(-3).map(l => escapeHtml(l)).join('<br>');
      diagBox.innerHTML = ''
        + '<div class="diag-line"><b>端口：</b>' + s.port + '</div>'
        + '<div class="diag-line"><b>pi-web 进程：</b>' + (s.piweb.pid ? '运行中 (pid ' + s.piweb.pid + ')' : '未运行') + '</div>'
        + '<div class="diag-line"><b>重启次数：</b>' + s.piweb.restartCount + '</div>'
        + (s.updaterLogPath ? '<div class="diag-line"><b>更新日志：</b>' + escapeHtml(s.updaterLogPath) + '</div>' : '')
        + (stderr ? '<div class="diag-line"><b>pi-web stderr：</b><br>' + stderr + '</div>' : '');
    } catch (e) {
      showBanner('加载失败：' + e.message);
    }
  }

  autostartChk.addEventListener('change', async () => {
    try {
      await window.piSettings.setAutostart(autostartChk.checked);
      showBanner(autostartChk.checked ? '已开启开机自启' : '已关闭开机自启');
    } catch (e) {
      showBanner('设置失败：' + e.message);
      autostartChk.checked = !autostartChk.checked;
    }
  });

  shortcutChk.addEventListener('change', async () => {
    try {
      const r = await window.piSettings.setShortcut(shortcutChk.checked);
      shortcutChk.checked = r.enabled;
      showBanner(r.enabled ? '全局快捷键已启用' : '全局快捷键已关闭');
    } catch (e) {
      showBanner('快捷键设置失败：' + e.message);
      shortcutChk.checked = !shortcutChk.checked;
    }
  });

  document.getElementById('checkUpdateBtn').addEventListener('click', () => {
    window.piSettings.checkUpdate().catch((e) => showBanner('检查更新失败：' + e.message));
  });
  document.getElementById('openLogBtn').addEventListener('click', async () => {
    try {
      const result = await window.piSettings.openLogDir();
      if (result && result !== '') showBanner('打开失败：' + result);
    } catch (e) {
      showBanner('打开失败：' + e.message);
    }
  });
  document.getElementById('copyDiagBtn').addEventListener('click', async () => {
    try {
      const r = await window.piSettings.copyDiagnostics();
      showBanner('诊断信息已复制（' + r.length + ' 字符）');
    } catch (e) {
      showBanner('复制失败：' + e.message);
    }
  });

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[ch]);
  }

  // ---- 配置文件编辑器 ----
  const configList = document.getElementById('configList');
  const configModal = document.getElementById('configModal');
  const configTitle = document.getElementById('configTitle');
  const configPath = document.getElementById('configPath');
  const configContent = document.getElementById('configContent');
  let currentConfigName = null;

  async function loadConfigList() {
    try {
      const files = await window.piSettings.configList();
      configList.innerHTML = '';
      for (const f of files) {
        const row = document.createElement('div');
        row.className = 'config-row';
        const meta = f.exists
          ? (f.size + ' 字节' + (f.mtime ? ' · ' + f.mtime.slice(0, 16).replace('T', ' ') : ''))
          : '不存在（可创建）';
        row.innerHTML = '<span class="cname">' + escapeHtml(f.name) + '</span>'
          + '<span class="cmeta">' + meta + '</span>'
          + (f.sensitive ? '<span class="sensitive">⚠ 含密钥</span>' : '')
          + '<button class="btn" data-config="' + escapeHtml(f.name) + '">' + (f.exists ? '编辑' : '创建') + '</button>';
        row.querySelector('button').addEventListener('click', () => openConfigEditor(f));
        configList.appendChild(row);
      }
    } catch (e) {
      showBanner('配置列表加载失败：' + e.message);
    }
  }

  async function openConfigEditor(file) {
    try {
      let content = '{}';
      if (file.exists) {
        const r = await window.piSettings.configRead(file.name);
        content = r.content;
      }
      currentConfigName = file.name;
      configTitle.textContent = '编辑 ' + file.name;
      configPath.textContent = file.filePath;
      configContent.value = content;
      configModal.classList.add('show');
      if (file.sensitive) showBanner('⚠ 该文件包含 API 密钥，请勿分享此内容');
    } catch (e) {
      showBanner('读取失败：' + e.message);
    }
  }

  function hideConfigEditor() {
    configModal.classList.remove('show');
    currentConfigName = null;
  }

  async function saveConfig() {
    if (!currentConfigName) return;
    try {
      const r = await window.piSettings.configWrite(currentConfigName, configContent.value);
      showBanner('已保存（已自动备份）' + (r.keys ? '，含键: ' + r.keys.join(', ') : ''));
      hideConfigEditor();
      await loadConfigList();
    } catch (e) {
      showBanner('保存失败：' + e.message);
    }
  }

  document.getElementById('configCancelBtn').addEventListener('click', hideConfigEditor);
  document.getElementById('configSaveBtn').addEventListener('click', saveConfig);
  configModal.addEventListener('click', (e) => { if (e.target === configModal) hideConfigEditor(); });

  // ---- 会话导入 ----
  const importList = document.getElementById('importList');
  let importSessions = { claude: [], codex: [] };
  let importSource = 'claude';
  const IMPORT_CWD = 'F:/软件/我的秘籍';

  async function loadImportList() {
    try {
      importSessions = await window.piSettings.sessionScan();
      renderImportList();
    } catch (e) {
      importList.innerHTML = '<div class="desc">扫描失败：' + escapeHtml(e.message) + '</div>';
    }
  }

  function renderImportList() {
    const items = importSessions[importSource] || [];
    if (items.length === 0) {
      importList.innerHTML = '<div class="desc">未发现 ' + (importSource === 'claude' ? 'Claude' : 'Codex') + ' 会话（' + (importSource === 'claude' ? '~/.claude/projects' : '~/.codex/sessions') + '）。</div>';
      return;
    }
    importList.innerHTML = '';
    for (const s of items.slice(0, 50)) {
      const row = document.createElement('div');
      row.className = 'import-item';
      row.innerHTML = '<span class="iname" title="' + escapeHtml(s.source) + '">' + escapeHtml(s.sessionId.slice(0, 13)) + '</span>'
        + '<span class="imeta">' + (s.size / 1024).toFixed(0) + 'KB · ' + escapeHtml(s.mtime.slice(0, 10)) + '</span>'
        + '<button class="btn" data-import="' + escapeHtml(s.source) + '">导入</button>';
      row.querySelector('button').addEventListener('click', () => doImport(s.source));
      importList.appendChild(row);
    }
    if (items.length > 50) {
      const more = document.createElement('div');
      more.className = 'desc';
      more.textContent = '…还有 ' + (items.length - 50) + ' 个（导入全部会一起处理）';
      importList.appendChild(more);
    }
  }

  async function doImport(source) {
    try {
      const r = await window.piSettings.sessionImport({ source, type: importSource, cwd: IMPORT_CWD });
      showBanner('已导入 ' + r.messageCount + ' 条消息 → ' + r.sessionFile.split(/[\\/]/).pop());
      await loadImportList();
    } catch (e) {
      showBanner('导入失败：' + e.message);
    }
  }

  document.querySelectorAll('.import-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.import-tab').forEach((x) => x.classList.remove('active'));
      tab.classList.add('active');
      importSource = tab.dataset.src;
      renderImportList();
    });
  });
  document.getElementById('importAllBtn').addEventListener('click', async () => {
    const items = importSessions[importSource] || [];
    if (items.length === 0) { showBanner('没有可导入的会话'); return; }
    let ok = 0, fail = 0;
    for (const s of items) {
      try { await window.piSettings.sessionImport({ source: s.source, type: importSource, cwd: IMPORT_CWD }); ok++; }
      catch { fail++; }
    }
    showBanner('导入完成：成功 ' + ok + '，失败 ' + fail);
    await loadImportList();
  });

  load();
  loadConfigList();
  loadImportList();
})();
</script>
</body>
</html>
